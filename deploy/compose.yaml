# Auth gateway + Bifrost + MCP server. Real values live in deploy/local/ and deploy/.env (both gitignored);
# see README.md for setup. The gateway and MCP images are pulled from Docker Hub (published by
# .github/workflows/images.yml); compose.build.yaml builds them from source instead, for development.
name: assistant

services:
  gateway:
    image: mahasamuha/samu-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: local/gateway.env
    environment:
      UPSTREAM_URL: http://bifrost:8080
      MCP_URL: http://mcp:8080
      PORT: "8080"
    ports:
      # Only the reverse proxy should reach the gateway. Keep it on loopback unless the proxy runs elsewhere.
      - "${GATEWAY_BIND:-127.0.0.1:8787}:8080"
    volumes:
      - gateway-logs:/app/logs
    # Internet-facing through the proxy: only the logs volume is writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - bifrost
      - mcp
    networks:
      - llm
      - tools

  # Remote tools (plan §4b step 4). Like Bifrost: no ports, reachable only from the gateway; needs
  # outbound access for the search API. It reads untrusted web content, so it gets its own network
  # (it can't reach Bifrost's admin API) and a locked-down container.
  mcp:
    image: mahasamuha/samu-mcp:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY:?set BRAVE_API_KEY in deploy/.env}
      # Optional: with it, the server's get_weather (Pirate Weather) overrides the phone's Open-Meteo one.
      PIRATE_WEATHER_API_KEY: ${PIRATE_WEATHER_API_KEY:-}
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - tools

  bifrost:
    image: maximhq/bifrost:v2.3.1
    restart: unless-stopped
    env_file: local/bifrost.env
    volumes:
      # Config store (virtual keys, budget usage) and cost logs; must persist across restarts.
      - bifrost-data:/app/data
      - ./local/bifrost-config.json:/app/data/config.json:ro
    # No ports: Bifrost is reachable only from the gateway. Outbound access to the provider is still needed.
    networks:
      - llm

# Two networks so the gateway is the only container that reaches both Bifrost and the MCP server.
networks:
  llm: {}
  tools: {}

volumes:
  gateway-logs: {}
  bifrost-data: {}
